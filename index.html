<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pace Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%224%22 y=%222%22 width=%228%22 height=%2212%22 rx=%221%22 fill=%22none%22 stroke=%22%23e8b04a%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start" class="screen">
      <h1>Pace Lab</h1>
      <p class="sub">One knight, three crypt fights, fifteen cards. Pick how a turn plays.</p>
      <div class="modes">
        <button class="mode" data-mode="fast" disabled>
          <b>A · Fast</b>
          <span>3 energy, draw 5. Tap a card and it hits at once. 1x / 2x and Skip.</span>
        </button>
        <button class="mode" data-mode="plan" disabled>
          <b>B · Plan then Watch</b>
          <span>Queue the whole turn with exact previews, press GO, watch it play out.</span>
        </button>
        <button class="mode coming" data-mode="kaitos" disabled>
          <b>C · Spirit Combo</b>
          <span>Chain up to 5 cards on a timer while the attacks play. Pairs and straights pay.</span>
          <em>coming</em>
        </button>
      </div>
      <p id="loading">Loading…</p>
    </div>

    <div id="battle-hud" class="hud" hidden>
      <div id="plates"></div>
      <div id="numbers"></div>
      <div class="topbar">
        <span id="fight-label" class="panel"></span>
        <span class="right"><button id="speed" class="chip">1x</button><button id="skip" class="chip">Skip ▸▸</button></span>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div class="bottom">
        <div class="status"><span id="energy" class="orb"></span><span id="chain" hidden></span><span id="piles"></span></div>
        <div id="queue" hidden></div>
        <div id="hand"></div>
        <div id="turn-note" hidden></div>
        <button id="end-turn">End turn</button>
      </div>
      <div id="reward" class="overlay panel" hidden>
        <div class="otitle">Fight won: take a card</div>
        <div id="reward-hp" class="osub"></div>
        <div id="reward-cards"></div>
        <button id="reward-skip" class="chip">Skip</button>
      </div>
      <div id="run-end" class="overlay panel" hidden>
        <div id="run-result" class="otitle"></div>
        <div id="run-stats" class="osub"></div>
        <button id="again" class="chip">Play again</button>
      </div>
    </div>

    <div id="flash"></div>
    <div id="letterbox"><i></i><i></i></div>
    <button id="back" hidden>‹ Modes</button>
    <div id="fps" class="panel" hidden></div>
    <div id="credits">Characters: KayKit (CC0)</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
